
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-ai"
version = "0.1.0"
description = "A production-oriented RAG knowledge assistant"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "psycopg[binary]",
    "boto3",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "celery[redis]",
    "pymupdf",
    "python-docx",
    "transformers",
    "sentencepiece",
    "sentence-transformers>=3.0.0",
    "requests",
    "ollama",
    "streamlit",

]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backend*",
    "database*",
    "infra*",
    "ingestion*",
    "llm*",
    "retrieval*",
    "worker*",
]
exclude = [
    "tests*",
    "frontend*",
    "evaluation*",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring real infrastructure services",
]

[tool.ruff.lint]
ignore = ["B008"]
